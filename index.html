<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Health Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        medical: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar-option { transition: all 0.2s; cursor: pointer; }
        .avatar-option:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden fade-in p-8">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-medical-600">สร้างโปรไฟล์ของคุณ</h1>
            <p class="text-gray-500 text-sm mt-2">เลือกรูปสัตว์ประจำตัวและตั้งชื่อเพื่อเริ่มต้น</p>
        </div>
        
        <form id="loginForm" onsubmit="event.preventDefault(); login();">
            <!-- ส่วนเลือกรูปโปรไฟล์ -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-3 text-center">เลือกรูปโปรไฟล์ 👤</label>
                <div class="grid grid-cols-3 gap-4" id="avatarContainer">
                    <div class="avatar-option bg-medical-50 border-2 border-medical-500 text-4xl rounded-2xl flex items-center justify-center h-20" data-avatar="🐶">🐶</div>
                    <div class="avatar-option bg-gray-50 border-2 border-transparent text-4xl rounded-2xl flex items-center justify-center h-20" data-avatar="🐱">🐱</div>
                    <div class="avatar-option bg-gray-50 border-2 border-transparent text-4xl rounded-2xl flex items-center justify-center h-20" data-avatar="🐼">🐼</div>
                    <div class="avatar-option bg-gray-50 border-2 border-transparent text-4xl rounded-2xl flex items-center justify-center h-20" data-avatar="🦊">🦊</div>
                    <div class="avatar-option bg-gray-50 border-2 border-transparent text-4xl rounded-2xl flex items-center justify-center h-20" data-avatar="🐰">🐰</div>
                    <div class="avatar-option bg-gray-50 border-2 border-transparent text-4xl rounded-2xl flex items-center justify-center h-20" data-avatar="🐯">🐯</div>
                </div>
            </div>

            <!-- ส่วนกรอกชื่อ -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-2">ชื่อผู้ใช้งาน</label>
                <input type="text" id="username" placeholder="เช่น น้องสมชาย" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-xl focus:ring-medical-500 focus:border-medical-500 block p-3">
            </div>

            <button type="submit" class="w-full text-white bg-medical-500 hover:bg-medical-600 focus:ring-4 focus:ring-medical-100 font-medium rounded-xl text-lg px-5 py-3.5 text-center transition-colors shadow-lg shadow-medical-500/30">
                เริ่มต้นใช้งาน ➔
            </button>
        </form>
    </main>

    <script>
        let selectedAvatar = "🐶"; // ค่าเริ่มต้น
        const options = document.querySelectorAll('.avatar-option');
        
        // ลอจิกคลิกเลือกรูปภาพ
        options.forEach(opt => {
            opt.addEventListener('click', function() {
                options.forEach(o => {
                    o.classList.remove('border-medical-500', 'bg-medical-50');
                    o.classList.add('border-transparent', 'bg-gray-50');
                });
                this.classList.remove('border-transparent', 'bg-gray-50');
                this.classList.add('border-medical-500', 'bg-medical-50');
                selectedAvatar = this.getAttribute('data-avatar');
            });
        });

        // ลอจิกบันทึกข้อมูลและเปลี่ยนหน้า
        function login() {
            const username = document.getElementById('username').value;
            localStorage.setItem('userAvatar', selectedAvatar);
            localStorage.setItem('userName', username);
            window.location.href = 'input.html'; // ลิงก์ไปยังหน้าแอป
        }
    </script>
</body>
</html>
